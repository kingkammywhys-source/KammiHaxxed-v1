<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KammiHaxed // NPP Overlord v2.0</title>
    <style>
        body {
            background-color: #050505;
            color: #ff00ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff00ff;
            border-bottom: 2px solid #ff00ff;
            padding-bottom: 10px;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
        }
        .status-indicator {
            font-size: 0.6em;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .container {
            width: 100%;
            max-width: 800px;
            border: 1px solid #ff00ff;
            padding: 15px;
            box-shadow: 0 0 15px #ff00ff;
            position: relative;
            background: rgba(0,0,0,0.8);
        }

        /* Signal Bar */
        .signal-bar {
            height: 4px;
            width: 100%;
            background-color: #222;
            margin-bottom: 15px;
            position: relative;
        }
        .signal-wave {
            height: 100%;
            width: 20%;
            background-color: #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .broadcasting .signal-wave {
            opacity: 1;
            animation: wave-move 0.8s infinite linear;
        }
        @keyframes wave-move {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

        .panel {
            border: 1px dashed #555;
            padding: 10px;
            background: #0a0a0a;
        }
        .panel-title {
            font-size: 0.8em;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .card-display {
            font-size: 1.1em;
            word-break: break-all;
            color: #fff;
            font-weight: bold;
        }
        
        /* Terminal / Hex Dump */
        .terminal {
            height: 120px;
            overflow-y: scroll;
            border: 1px solid #ff00ff;
            padding: 5px;
            font-size: 0.75em;
            text-align: left;
            background: #000;
            color: #0f0;
        }
        .hex-line { margin: 0; line-height: 1.2; }
        .tag { color: #ff00ff; }
        .cmd { color: #ffff00; }
        .success { color: #00ff00; }

        /* Inputs */
        input[type="text"], input[type="number"] {
            background: #111;
            border: 1px solid #ff00ff;
            color: #fff;
            padding: 8px;
            width: 95%;
            font-family: inherit;
            margin-bottom: 5px;
        }
        label { font-size: 0.7em; color: #aaa; }

        button {
            background-color: #ff00ff;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
            text-transform: uppercase;
        }
        button:hover { background-color: #fff; box-shadow: 0 0 10px #fff; }
        button:disabled { background-color: #333; color: #777; cursor: not-allowed; }

        .footer {
            margin-top: auto;
            padding-top: 30px;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 5px #ff00ff; }
            50% { text-shadow: 0 0 20px #ff00ff; opacity: 0.8; }
            100% { text-shadow: 0 0 5px #ff00ff; }
        }
    </style>
</head>
<body>

    <h1>KammiHaxed <span class="status-indicator">● LIVE</span></h1>

    <div class="container" id="main-container">
        <div class="signal-bar"><div class="signal-wave"></div></div>

        <div class="grid">
            <!-- Token Panel -->
            <div class="panel">
                <div class="panel-title">Active Token (NFC)</div>
                <div id="token-display" class="card-display">-- WAITING --</div>
            </div>
            
            <!-- Card Details -->
            <div class="panel">
                <div class="panel-title">Source Card (Adelaide)</div>
                <div id="card-area" class="card-display">Loading...</div>
            </div>
        </div>

        <!-- PayID Section -->
        <div class="panel" style="margin-bottom: 15px;">
            <div class="panel-title">NPP PayID Gateway</div>
            <label>SENDER PAYID</label>
            <input type="text" id="payid-sender" placeholder="payid@domain.com.au">
            <label>RECEIVER PAYID</label>
            <input type="text" id="payid-receiver" placeholder="payid@pos-terminal.com.au">
            <label>AMOUNT (AUD)</label>
            <input type="number" id="payid-amount" placeholder="0.00">
            <button onclick="initiatePayID()">EXECUTE TRANSFER</button>
        </div>

        <button id="btn-tap" onclick="startNFC()">INITIATE NFC BROADCAST</button>
        
        <div class="panel terminal" id="log-box">
            <div class="hex-line">> System initialized.</div>
            <div class="hex-line">> Awaiting handshake...</div>
        </div>
    </div>

    <div class="footer">FUCK THE POLICE</div>

    <script src="/app.js"></script>
</body>
</html>
