<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KammiHaxed - NPP Overlord</title>
    <style>
        body {
            background-color: #000;
            color: #ff00ff; /* Neon Pink */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #ff00ff;
        }
        .container {
            width: 100%;
            max-width: 600px;
            border: 2px solid #ff00ff;
            padding: 20px;
            box-shadow: 0 0 20px #ff00ff;
        }
        .card-display {
            border: 1px dashed #ff00ff;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 1.2em;
            word-break: break-all;
        }
        button {
            background-color: #ff00ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #fff;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #fff;
        }
        .logs {
            height: 150px;
            overflow-y: scroll;
            border: 1px solid #ff00ff;
            padding: 10px;
            margin-top: 20px;
            font-size: 0.8em;
            text-align: left;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            background-color: #111;
            border: 1px solid #ff00ff;
            color: #fff;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 5px #ff00ff; }
            50% { text-shadow: 0 0 20px #ff00ff; opacity: 0.8; }
            100% { text-shadow: 0 0 5px #ff00ff; }
        }
    </style>
</head>
<body>

    <h1>KammiHaxed // Adelaide Node</h1>

    <div class="container">
        <div id="card-area" class="card-display">
            Waiting for tokenization...
        </div>

        <button id="btn-tap" onclick="startNFCHCE()">BROADCAST NFC (FORCE APPROVED)</button>
        <button id="btn-token" onclick="generateAndBroadcastToken()">GENERATE & BROADCAST TOKEN</button>
        
        <div style="margin-top: 20px;">
            <h3>NPP PAYID TRANSFER</h3>
            <div class="input-group">
                <label>Sender PayID:</label>
                <input type="text" id="sender-payid" placeholder="e.g., john@adelaidecorp.com.au">
            </div>
            <div class="input-group">
                <label>Receiver PayID:</label>
                <input type="text" id="receiver-payid" placeholder="e.g., merchant@pos-terminal.com.au">
            </div>
            <div class="input-group">
                <label>Amount (AUD):</label>
                <input type="number" id="amount" placeholder="100.00">
            </div>
            <button id="btn-payid" onclick="initiatePayID()">EXECUTE REAL PAYMENT</button>
        </div>
        
        <div class="status" id="status-text">System Idle. Ready for signal.</div>

        <div class="logs" id="log-box">
            > System initialized.<br>
            > Connected to Render backend.<br>
            > Awaiting input...
        </div>
    </div>

    <div class="footer">FUCK THE POLICE</div>

    <script src="/app.js"></script>
</body>
</html>
