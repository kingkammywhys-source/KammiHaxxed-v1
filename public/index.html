<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KammiHaxed // NPP Overlord</title>
    <style>
        body {
            background-color: #000;
            color: #ff00ff; /* Neon Pink */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 10px #ff00ff; }
        .container {
            width: 100%;
            max-width: 600px;
            border: 2px solid #ff00ff;
            padding: 20px;
            box-shadow: 0 0 20px #ff00ff;
        }
        .card-display {
            border: 1px dashed #ff00ff;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 1.2em;
            word-break: break-all;
        }
        button {
            background-color: #ff00ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .status { margin-top: 10px; font-size: 0.9em; color: #fff; }
        .logs {
            height: 150px;
            overflow-y: scroll;
            border: 1px solid #ff00ff;
            padding: 10px;
            margin-top: 20px;
            font-size: 0.8em;
            text-align: left;
            background: #111;
        }
        .hex-line { margin: 2px 0; }
        .success { color: #00ff00; font-weight: bold; }
        .tag { color: #00ffff; }
        
        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 5px #ff00ff; }
            50% { text-shadow: 0 0 20px #ff00ff; opacity: 0.8; }
            100% { text-shadow: 0 0 5px #ff00ff; }
        }
        
        /* Broadcast Animation */
        .broadcasting {
            border-color: #fff;
            box-shadow: 0 0 30px #fff;
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <h1>KammiHaxed // Adelaide Node</h1>

    <div class="container" id="main-container">
        <div id="card-area" class="card-display">Waiting for tokenization...</div>
        <div id="token-display" style="font-size: 0.8em; color: #fff;">Token: ---</div>

        <button id="btn-tap" onclick="startNFC()">INITIATE TAP TO PAY (RAW APDU)</button>
        <button id="btn-payid" onclick="initiatePayID()">EXECUTE NPP PAYID TRANSFER</button>
        
        <div class="status" id="status-text">System Idle. Ready for signal.</div>

        <div class="logs" id="log-box">
            > System initialized.<br>
            > Connected to Render backend.<br>
            > Awaiting input...
        </div>
    </div>

    <div class="footer">FUCK THE POLICE</div>

    <script src="/app.js"></script>
</body>
</html>
